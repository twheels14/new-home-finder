:root{
  --bg:#F3F5F8; --surface:#FFFFFF; --ink:#1F2B3D; --muted:#5A6678; --line:#D8DEE7;
  --navy:#1B2A49; --navy-ink:#F4F7FB; --teal:#0E7C86; --teal-soft:#E1F1F2; --teal-ink:#0A5F67;
  --gold:#FFF1CC; --gold-line:#E4C877; --gold-ink:#5C4400; --good:#1C6B3A; --pay:#1D7A4A; --good-soft:#DDF0E3; --drop:#B32620; --drop-soft:#FCE4E2; --map:#E9EEF4; --dot:#41557D;
  --font:'Lato','Segoe UI','Arial Hebrew',Arial,system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111926; --surface:#1A2536; --ink:#E7ECF3; --muted:#9BA8BB; --line:#2E3C52;
  --navy:#2A4272; --navy-ink:#F4F7FB; --teal:#58C4CD; --teal-soft:#16343C; --teal-ink:#8EDCE3;
  --gold:#3A3217; --gold-line:#8C7A33; --gold-ink:#F3DD9B; --good:#7FD39B; --pay:#6FD6A0; --good-soft:#1B3A29; --drop:#FF9A92; --drop-soft:#4A2320; --map:#1F2B3E; --dot:#8FA6D1; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111926; --surface:#1A2536; --ink:#E7ECF3; --muted:#9BA8BB; --line:#2E3C52;
  --navy:#2A4272; --navy-ink:#F4F7FB; --teal:#58C4CD; --teal-soft:#16343C; --teal-ink:#8EDCE3;
  --gold:#3A3217; --gold-line:#8C7A33; --gold-ink:#F3DD9B; --good:#7FD39B; --pay:#6FD6A0; --good-soft:#1B3A29; --drop:#FF9A92; --drop-soft:#4A2320; --map:#1F2B3E; --dot:#8FA6D1; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:18px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 24px;min-height:100vh}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--teal-ink)}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 0 6px;flex-wrap:wrap}
.who{font-size:15px;color:var(--muted)} .who b{color:var(--ink)}
.skipsheet{text-align:center;margin:26px 0 0;font-size:13px}
.skipsheet a{color:var(--muted);text-decoration:underline;padding:10px 8px;display:inline-block}
.lang{display:flex;gap:6px;margin:0 0 8px}
.lang button{border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 14px;font-size:15px;font-weight:700;min-height:38px}
.lang button[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:var(--navy-ink)}
h1{font-size:clamp(30px,6vw,42px);line-height:1.1;margin:8px 0 12px;font-weight:900;letter-spacing:-.01em;text-wrap:balance}
h2{font-size:clamp(26px,5vw,34px);line-height:1.15;margin:4px 0 8px;font-weight:900;text-wrap:balance}
.sub{color:var(--muted);margin:0 0 20px;font-size:19px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px}
.hero{padding:28px 22px;margin-top:6px}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin:22px 0 0;color:var(--muted);font-size:15px}
.stats span{background:var(--bg);border-radius:999px;padding:6px 12px}
.incent{background:var(--gold);border:2px solid var(--gold-line);color:var(--gold-ink);border-radius:14px;padding:12px 16px;margin:8px 0 14px;font-size:16px;font-weight:700}
.incent .ih{display:block;font-size:17px;font-weight:900}
.incent ul{margin:6px 0 2px;padding-inline-start:20px;font-size:15px;font-weight:400;line-height:1.4}
.incent li{margin:2px 0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:58px;padding:0 26px;border-radius:14px;border:2px solid transparent;font-weight:900;font-size:19px;text-decoration:none}
.btn.primary{background:var(--navy);color:var(--navy-ink)}
.btn.primary:hover{filter:brightness(1.12)}
.btn.ghost{background:var(--surface);border-color:var(--line);color:var(--ink)}
.btn.ghost:hover{border-color:var(--teal)}
.btn.drop{background:var(--drop-soft);border-color:var(--drop);color:var(--drop)}
.btn.link{background:none;color:var(--muted);min-height:48px;padding:0 12px;font-weight:700;text-decoration:underline}
.row{display:flex;gap:12px;flex-wrap:wrap}
.progress{display:flex;gap:6px;margin:6px 0 18px}
.progress i{flex:1;height:6px;border-radius:3px;background:var(--line)}
.progress i.on{background:var(--teal)}
.stepno{font-size:14px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--teal-ink);margin:0}
.grp{font-size:14px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:22px 0 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.opt{text-align:start;background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:14px 16px;min-height:76px;display:flex;flex-direction:column;gap:2px;position:relative}
.opt:hover{border-color:var(--teal)}
.opt .t{font-weight:900;font-size:18px;padding-inline-end:28px}
.opt .d{font-size:14px;color:var(--muted)}
.opt .n{font-size:14px;color:var(--teal-ink);font-weight:700}
.opt[aria-pressed="true"]{border-color:var(--teal);background:var(--teal-soft)}
.opt[aria-pressed="true"]::after{content:"\2713";position:absolute;inset-inline-end:12px;top:10px;width:24px;height:24px;border-radius:50%;background:var(--teal);color:#fff;font-size:15px;font-weight:900;display:grid;place-items:center}
.opt.part{border-color:var(--teal);border-style:dashed}
.chips{display:flex;gap:10px;flex-wrap:wrap}
.chip{border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:0 18px;min-height:52px;font-weight:700;font-size:17px}
.chip:hover{border-color:var(--teal)}
.chip[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:var(--navy-ink)}
.chip.dropc[aria-pressed="true"]{background:var(--drop);border-color:var(--drop);color:#fff}
.seg{display:grid;grid-template-columns:1fr 1fr;border:2px solid var(--line);border-radius:14px;overflow:hidden;background:var(--surface)}
.seg button{min-height:56px;border:0;background:none;font-weight:900;font-size:17px}
.seg button[aria-pressed="true"]{background:var(--navy);color:var(--navy-ink)}
.money{display:flex;align-items:center;gap:6px;background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:0 16px;margin:16px 0;direction:ltr}
.money:focus-within{border-color:var(--teal)}
.money span{font-size:30px;font-weight:900;color:var(--muted)}
.money input{border:0;background:none;outline:0;width:100%;min-height:72px;font-size:36px;font-weight:900;font-variant-numeric:tabular-nums}
.money small{font-size:16px;color:var(--muted);white-space:nowrap;font-weight:700}
.live{margin:16px 0 0;font-size:17px;color:var(--teal-ink);font-weight:700;min-height:26px}
.loan{margin-top:26px}
.loan .opt{min-height:70px}
.nav{position:sticky;bottom:0;background:var(--bg);padding:14px 0 calc(14px + env(safe-area-inset-bottom,0px));margin-top:24px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;border-top:1px solid var(--line)}
.nav .grow{flex:1}
.sumbar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.sumbar button{border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:15px;font-weight:700;min-height:40px}
.sumbar button:hover{border-color:var(--teal)}
.count{font-size:clamp(34px,7vw,48px);font-weight:900;line-height:1;margin:6px 0}
.count small{font-size:19px;font-weight:700;color:var(--muted)}
.toolbar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin:16px 0}
.toolbar select{border:2px solid var(--line);background:var(--surface);border-radius:12px;min-height:48px;padding:0 12px;font-size:16px;font-weight:700}
.comm{margin:0 0 16px;overflow:hidden}
.comm header{padding:16px 18px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;background:var(--teal-soft);border-bottom:1px solid var(--line)}
.tag.low{background:#FFE4C7;color:#8A4300;font-size:13px;vertical-align:middle;white-space:nowrap}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tag.low{background:#4A2E14;color:#FFC48A}}
:root[data-theme="dark"] .tag.low{background:#4A2E14;color:#FFC48A}
.est{font-size:12px;color:var(--muted);font-weight:400}
.clink{font-size:15px;font-weight:700;display:inline-block;margin-top:4px}
.comm h3{margin:0;font-size:21px;font-weight:900}
.comm .meta{font-size:15px;color:var(--muted)}
.comm .rng{text-align:end;font-size:15px;color:var(--teal-ink);font-weight:700}
.home{display:grid;grid-template-columns:1fr auto;gap:4px 14px;padding:14px 18px;border-top:1px solid var(--line);align-items:center}
.home:first-of-type{border-top:0}
.home .addr{font-weight:900;font-size:18px;direction:ltr;text-align:start}
html[dir="rtl"] .home .addr{text-align:right}
.home .facts{font-size:15px;color:var(--muted)}
.home .pay{font-size:26px;font-weight:900;color:var(--pay);text-align:end;font-variant-numeric:tabular-nums;line-height:1.1}
.home .pay small{font-size:14px;font-weight:700;color:var(--muted)}
.home .price{font-size:15px;text-align:end;color:var(--muted);font-variant-numeric:tabular-nums}
.home .links{grid-column:1/-1;font-size:15px;display:flex;gap:16px;flex-wrap:wrap;align-items:center}
.tag{display:inline-block;font-size:13px;font-weight:700;border-radius:999px;padding:2px 10px;background:var(--good-soft);color:var(--good);margin-inline-start:6px;vertical-align:middle}
.tag.drop{background:var(--drop-soft);color:var(--drop);margin:0;font-size:14px;padding:3px 12px}
.more{display:block;width:100%;border:0;border-top:1px solid var(--line);background:var(--surface);min-height:52px;font-weight:900;font-size:16px;color:var(--teal-ink)}
.more:hover{background:var(--teal-soft)}
.help{padding:20px;margin:16px 0}
.help h3{margin:0 0 10px;font-size:20px}
.help .btn{min-height:50px;font-size:17px;margin:4px 8px 4px 0}
html[dir="rtl"] .help .btn{margin:4px 0 4px 8px}
.foot{margin-top:28px;font-size:14px;color:var(--muted);line-height:1.5}
.foot .contact{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;font-size:16px;color:var(--ink);margin-bottom:14px}
.foot .contact b{font-size:20px}
.tour{margin-top:12px;min-height:54px;font-size:18px;color:var(--navy-ink)!important}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));background:var(--navy);color:var(--navy-ink);padding:12px 20px;border-radius:12px;font-weight:700;z-index:20}
.status{padding:30px 6px;font-size:19px;color:var(--muted)}
@media (max-width:520px){body{font-size:17px}.home{grid-template-columns:1fr}.home .pay,.home .price{text-align:start}.comm .rng{text-align:start}.btn{width:100%}.nav .btn{width:auto;flex:1}.nav .btn.link{flex:0}.hero .btn{width:100%}}
#printSheet{display:none}
@media print{body>.wrap,.toast{display:none!important}#printSheet{display:block;color:#000;background:#fff;font-family:Lato,Arial,sans-serif;font-size:12pt}#printSheet h1{font-size:20pt;margin:0 0 6pt}#printSheet .ph{border-top:1px solid #999;padding:7pt 0;break-inside:avoid}#printSheet .pm{font-size:10pt;color:#333}body{background:#fff}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

function t(k,p){

}

/* ---------- data (loaded from data.json beside this page, refreshed by the daily update) ---------- */
let C=[],H=[],DATA=null,AREAS=[];
const RATE=.0575, TERM=360, HOI=.003, HS=.8;
const LOANS={
  FHA:{name:"FHA",r:.0575,d:.035,f:.0175,mi:.0055},
  Conventional:{name:"Conventional",r:.0625,d:.10,f:0,mi:.0089},
  VA:{name:"VA",r:.0575,d:0,f:.0215,mi:0},
  USDA:{name:"USDA",r:.0575,d:0,f:.01,mi:.0035},
  Cash:{name:"Cash",r:.0575,d:1,f:0,mi:0}
};
const LOANKEYS=["FHA","Conventional","VA","USDA"];
const loanName=k=>k==="Conventional"?t("n_Conventional"):LOANS[k].name;
const rateTxt=k=>(LOANS[k].r*100).toFixed(2)+"%";
function payment(h,L){
  const l=LOANS[L], base=h.price*(1-l.d), loan=base*(1+l.f), r=l.r/12;
  const pi=loan*r/(1-Math.pow(1+r,-TERM));
  const mi=l.d>=.2?0:l.mi;
  return Math.round(pi + h.price*h.tax*HS/12 + h.price*HOI/12 + base*mi/12 + C[h.c].sa/12);
}
const AREADEF=[["saO","g_sa"],["saS","g_sa"],["saE","g_sa"],["saW","g_sa"],["conv","g_bey"],["hill","g_bey"],["sanmarcos","g_bey"],["nb","g_bey"],["austin","g_bey"],["gaustin","g_bey"],["south","g_bey"],["central","g_bey"]];
let TYPTAX=0.0237;
const lowTag=c=>c.low?'<span class="tag low" title="'+esc(t("lowtax_tip",{x:(c.eff*100).toFixed(2)+"%",y:"",z:(TYPTAX*100).toFixed(2)+"%"}))+'">'+esc(t("lowtax"))+'</span>':'';
function initData(d){
  DATA=d;
  C=d.c.map((a,i)=>({i,name:a[0],city:a[1],reg:a[2],lat:a[3],lon:a[4],sa:a[5],n:0}));
  H=d.h.map(a=>({c:a[0],coe:a[1],addr:a[2],plan:a[3],fl:a[4],bd:a[5],ba:a[6],sf:a[7],price:a[8],tax:a[9],city:a[10],df:a[11]||0,dd:a[12]||0}));
  H.forEach(h=>{h.p={};for(const k in LOANS)h.p[k]=payment(h,k);C[h.c].n++;});
  const byC={};H.forEach(h=>(byC[h.c]=byC[h.c]||[]).push(h));
  C.forEach(c=>{const hs=byC[c.i]||[];if(!hs.length){c.eff=null;return;}const tx=hs.map(h=>h.tax).sort((a,b)=>a-b),pr=hs.map(h=>h.price).sort((a,b)=>a-b);c.taxr=tx[tx.length>>1];c.eff=c.taxr+c.sa/pr[pr.length>>1];});
  const effs=C.map(c=>c.eff).filter(x=>x!=null).sort((a,b)=>a-b);TYPTAX=effs[effs.length>>1];
  C.forEach(c=>{c.low=c.eff!=null&&c.eff<=TYPTAX*0.85;});
  AREAS=AREADEF.map(([id,grp])=>{const a={id,grp};a.comms=C.filter(c=>c.reg===id);a.homes=a.comms.reduce((s,c)=>s+c.n,0);return a;}).filter(a=>a.comms.length);
}
function areaDesc(a){
  const by=a.comms.slice().sort((x,y)=>y.n-x.n);
  if(a.grp==="g_sa"){const nm=by.map(c=>c.name);return nm.slice(0,3).join(", ")+(nm.length>3?" "+t("more_n",{n:nm.length-3}):"");}
  const ct=[...new Set(by.map(c=>c.city))];return ct.slice(0,4).join(", ")+(ct.length>4?" "+t("more_n",{n:ct.length-4}):"");

function matches(h,skip){

      if(sorted.length>S.allShown)h+='<button class="btn ghost" id="moreAll" style="width:100%">'+esc(t("show40"))+'</button>';
    }
    h+='<div class="row" style="margin-top:18px"><button class="btn ghost" id="copy">'+esc(t("copy"))+'</button><button class="btn ghost" id="pdf">'+esc(t("pdf"))+'</button><button class="btn ghost" id="share">'+esc(t("share"))+'</button><button class="btn ghost" id="restart">'+esc(t("restart"))+'</button></div>'+sheetLink();
  }
  if(SIGNUP_URL)h+='<div class="card help" style="margin-top:22px"><h3>'+esc(t("signup_h"))+'</h3><a class="btn primary" style="margin:4px 0" href="'+SIGNUP_URL+'" target="_blank" rel="noopener">'+esc(t("signup_btn"))+'</a></div>';
  app.innerHTML=h;
  app.querySelectorAll("[data-e]").forEach(b=>b.onclick=()=>go(+b.dataset.e));
  app.querySelectorAll("[data-nodrops]").forEach(b=>b.onclick=()=>{S.dropsOnly=false;render();});
  app.querySelectorAll("[data-sg]").forEach(b=>b.onclick=()=>{sg[+b.dataset.sg].fn();render();});
  const rs=n=>{const e=$(n);if(e)e.onclick=()=>{S.sel.clear();S.budget=null;S.cash=false;S.mode="pay";S.sort="pay";S.beds=0;S.sqft=0;S.when=0;S.dropsOnly=false;S.shown={};S.allShown=40;S.commShown=6;go(0);};};
  rs("#restart");rs("#restart2");
  app.querySelectorAll("[data-vw]").forEach(b=>b.onclick=()=>{S.view=b.dataset.vw;render();});
  const dc=$("#dropsChip"); if(dc)dc.onclick=()=>{S.dropsOnly=!S.dropsOnly;S.commShown=6;render();};
  const so=$("#sort"); if(so)so.onchange=()=>{S.sort=so.value;render();};
  app.querySelectorAll("[data-more]").forEach(b=>b.onclick=()=>{S.shown[b.dataset.more]=999;render();});
  const mc=$("#moreComm"); if(mc)mc.onclick=()=>{S.commShown+=6;render();};
  const ma=$("#moreAll"); if(ma)ma.onclick=()=>{S.allShown+=40;render();};
  const cp=$("#copy"); if(cp)cp.onclick=()=>{track("copy-list");copyList(list);};
  const pf=$("#pdf"); if(pf)pf.onclick=()=>{track("pdf");printList(list);};
  const sh=$("#share"); if(sh)sh.onclick=()=>{track("share-link");shareLink();};
  trackResults(list);
}
function printList(list){
  const top=list.slice().sort(SORTS[S.sort][1]).slice(0,15);
  const head=S.cash?t("cp_head_cash",{n:list.length}):t("cp_head_loan",{n:list.length,l:loanName(S.loan)});
  $("#printSheet").innerHTML='<h1>'+esc(t("pdf_title"))+'</h1><p class="pm">'+esc(head)+'</p>'+
   top.map(h=>'<div class="ph"><b>'+esc(h.addr)+'</b>, '+esc(h.city)+' &middot; '+esc(C[h.c].name)+'<br>'+esc(t("facts",{bd:h.bd,ba:h.ba,sf:num(h.sf),fl:t("story",{n:h.fl}).replace("{n}",h.fl),plan:h.plan}))+'<br><b>'+(S.cash?m(h.price)+' &middot; '+esc(t("taxins",{x:fmt(h.p.Cash)})):m(h.p[S.loan])+esc(t("per_mo"))+' &middot; '+m(h.price))+'</b> &middot; '+esc(closingLabel(h.coe))+(h.coe>TODAY?' '+esc(t("est")):'')+(h.df?' &middot; '+esc(t("dropped",{x:fmt(h.df-h.price)})):'')+'</div>').join("")+
   '<p class="pm">'+esc(t("cp_foot",{name:CONTACT.name,title:t("title"),phone:CONTACT.phone,email:CONTACT.email}))+'</p><p class="pm">'+esc(S.cash?t("disc_cash",{d:DATA.updated}):t("disc_loan",{l:loanName(S.loan),note:t("l_"+S.loan).replace(/\s*\(.*\)$/,""),r:rateTxt(S.loan),d:DATA.updated}))+'</p>';
  window.print();
}
function copyList(list){
  const top=list.slice().sort(SORTS[S.sort][1]).slice(0,10);
  const txt=(S.cash?t("cp_head_cash",{n:list.length}):t("cp_head_loan",{n:list.length,l:loanName(S.loan)}))+"\n\n"+
   top.map(h=>h.addr+", "+h.city+" ("+C[h.c].name+")\n"+t(S.cash?"cp_line_cash":"cp_line_loan",{bd:h.bd,ba:h.ba,sf:num(h.sf),price:fmt(h.price),pay:fmt(S.cash?h.p.Cash:h.p[S.loan])})+(h.df?" ▼ "+fmt(h.df-h.price):"")).join("\n\n")+
   "\n\n"+t("cp_foot",{name:CONTACT.name,title:t("title"),phone:CONTACT.phone,email:CONTACT.email});
  const fallback=()=>{const ta=document.createElement("textarea");ta.value=txt;document.body.appendChild(ta);ta.select();try{document.execCommand("copy");toast(t("copied"));}catch(e){}ta.remove();};
  try{navigator.clipboard.writeText(txt).then(()=>toast(t("copied")),fallback);}catch(e){fallback();}
}

/* ---------- share link + visitor counts ---------- */
const ANALYTICS={code:"",prefix:"trevor"};   /* GoatCounter site code (free, no cookies). Leave empty to turn counting off. */
function track(path,title){try{if(window.goatcounter&&window.goatcounter.count)window.goatcounter.count({path:ANALYTICS.prefix+"/"+path,title:title||path,event:true});}catch(e){}}
let _lastTrack="";
function trackResults(list){
  const sig=[...S.sel].map(i=>C[i].name).join(",")+"|"+(S.cash?"cash":S.loan)+"|"+S.beds+"|"+S.when;
  if(sig===_lastTrack)return; _lastTrack=sig;
  const areas=AREAS.filter(a=>areaState(a)===2).map(a=>a.id);
  track("results/"+(S.sel.size?(areas.length?areas.join("+"):"communities"):"anywhere"));
  track("buyer/"+(S.cash?"cash":S.loan));
}
document.addEventListener("click",e=>{const a=e.target.closest&&e.target.closest(".tour");if(a)track("tour-now");});
if(ANALYTICS.code){const sc=document.createElement("script");sc.async=true;sc.dataset.goatcounter="https://"+ANALYTICS.code+".goatcounter.com/count";sc.src="https://gc.zgo.at/count.js";document.head.appendChild(sc);}
function shareState(){
  const o={a:[...S.sel].map(i=>C[i].name+"|"+C[i].city),c:S.cash?1:0,m:S.mode,b:S.budget||0,l:S.loan,bd:S.beds,sf:S.sqft,w:S.when,d:S.dropsOnly?1:0,s:S.sort,v:S.view,g:LANG};
  return o;
}
function shareLink(){
  const url=location.origin+location.pathname+"#r="+encodeURIComponent(JSON.stringify(shareState()));
  const fb=()=>{const ta=document.createElement("textarea");ta.value=url;document.body.appendChild(ta);ta.select();try{document.execCommand("copy");toast(t("shared"));}catch(e){}ta.remove();};
  try{navigator.clipboard.writeText(url).then(()=>toast(t("shared")),fb);}catch(e){fb();}
}
function applyShared(){
  try{
    const m=location.hash.match(/^#r=(.+)$/); if(!m)return false;
    const o=JSON.parse(decodeURIComponent(m[1]));
    const keys=new Map(C.map(c=>[c.name+"|"+c.city,c.i]));
    S.sel=new Set((o.a||[]).map(k=>keys.get(k)).filter(i=>i!=null));
    S.cash=!!o.c; S.mode=o.m==="price"?"price":"pay"; S.budget=+o.b||null; if(LOANS[o.l]&&o.l!=="Cash")S.loan=o.l;
    S.beds=+o.bd||0; S.sqft=+o.sf||0; S.when=+o.w||0; S.dropsOnly=!!o.d; if(SORTS[o.s])S.sort=o.s; if(o.v==="all"||o.v==="comm")S.view=o.v;
    if(o.g&&T[o.g]&&!localStorage.getItem("nhf-lang")){LANG=o.g;applyLang();}
    S.step=5; return true;
  }catch(e){return false;}
}

/* ---------- start ---------- */
document.querySelectorAll("#lang button").forEach(b=>b.onclick=()=>{LANG=b.dataset.lg;try{localStorage.setItem("nhf-lang",LANG);}catch(e){} render();});
applyLang();
fetch("data.json",{cache:"no-store"}).then(r=>{if(!r.ok)throw 0;return r.json();}).then(d=>{initData(d);applyShared();render();track("visit");}).catch(()=>{$("#app").innerHTML='<p class="status">'+esc(t("loaderr"))+'</p>';});
</script>

</body></html>
