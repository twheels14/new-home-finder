.opt.part{border-color:var(--teal);border-style:dashed}

  VA:{name:"VA",r:.0575,d:0,f:.0215,mi:0},

function payment(h,L,noTax){
  const l=LOANS[L], base=h.price*(1-l.d), loan=base*(1+l.f), r=l.r/12;
  const pi=loan*r/(1-Math.pow(1+r,-TERM));
  const mi=l.d>=.2?0:l.mi;
  return Math.round(pi + (noTax?0:h.price*h.tax*HS/12) + h.price*HOI/12 + base*mi/12 + C[h.c].sa/12);
}

  H.forEach(h=>{h.p={};for(const k in LOANS)h.p[k]=payment(h,k);h.p.VAX=payment(h,"VA",true);h.hay=(h.addr+" "+C[h.c].name+" "+h.city+" "+h.plan).toLowerCase();C[h.c].n++;});
  const byC={};H.forEach(h=>(byC[h.c]=byC[h.c]||[]).push(h));
  C.forEach(c=>{const hs=byC[c.i]||[];if(!hs.length){c.eff=null;return;}const tx=hs.map(h=>h.tax).sort((a,b)=>a-b),pr=hs.map(h=>h.price).sort((a,b)=>a-b);c.taxr=tx[tx.length>>1];c.eff=c.taxr+c.sa/pr[pr.length>>1];});
  const effs=C.map(c=>c.eff).filter(x=>x!=null).sort((a,b)=>a-b);TYPTAX=effs[effs.length>>1];

function addMonths(n){const d=new Date();d.setMonth(d.getMonth()+n);return d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate();}
function matches(h,skip){
  skip=skip||{};
  if(S.loan==="USDA"&&!S.cash&&!USDA[C[h.c].name])return false;
  if(!skip.q && S.q){const hy=h.hay;for(const w of S.q.toLowerCase().split(/\s+/))if(w&&hy.indexOf(w)<0)return false;}
  if(!skip.area && S.sel.size && !S.sel.has(h.c))return false;
  if(!skip.budget && S.budget){ if(S.mode==="pay"&&!S.cash){ if(pay(h)>S.budget)return false; } else if(h.price>S.budget)return false; }
  if(!skip.beds && S.beds && h.bd<S.beds)return false;

  if(!skip.fl && S.fl && h.fl!==S.fl)return false;
  if(!skip.when && S.when && h.coe>addMonths(S.when))return false;
  if(!skip.drops && S.dropsOnly && !h.df)return false;
  return true;
}

   nav(1,t("cont"),true);
  app.innerHTML=h;

function suggestions(){
  const base=count(), out=[];

  if(S.dropsOnly)add(t("sg_drops"),()=>S.dropsOnly=false,count({drops:1}));
  if(S.sel.size)add(t("sg_area"),()=>S.sel.clear(),count({area:1}));
  if(S.beds)add(t("sg_beds"),()=>S.beds=0,count({beds:1}));
  if(S.sqft)add(t("sg_sqft"),()=>S.sqft=0,count({sqft:1}));
  if(S.fl)add(t("sg_fl"),()=>S.fl=0,count({fl:1}));
  if(S.when)add(t("sg_when"),()=>S.when=0,count({when:1}));
  if(S.budget){
    const step=(S.mode==="pay"&&!S.cash)?25:5000, nb=Math.round(S.budget*1.1/step)*step, old=S.budget; S.budget=nb; const n=count(); S.budget=old;
    add(t("sg_budget",{x:fmt(nb)+((S.mode==="pay"&&!S.cash)?t("per_mo"):"")}),()=>{S.budget=nb;},n);

}

/* ---------- copy a home card as an image ---------- */
const CARD_C={navy:"#1B2A49",teal:"#0E7C86",pay:"#1D7A4A",ink:"#1F2B3D",mut:"#5A6678",bg:"#F3F5F8",drop:"#B32620",dropbg:"#FCE4E2"};
async function makeCardBlob(h){
  try{await Promise.all([document.fonts.load("900 40px Lato"),document.fonts.load("700 24px Lato")]);}catch(e){}
  const W=1080,P=60,rtl=isRTL(),FF="Lato,'Segoe UI',Arial,sans-serif",K=CARD_C,iso=x=>rtl?"⁦"+x+"⁩":x;
  const cv=document.createElement("canvas");cv.width=W;cv.height=1500;const c=cv.getContext("2d");c.direction=rtl?"rtl":"ltr";
  const al=rtl?"right":"left",X0=rtl?W-P:P;
  const fit=(txt,w,px,wt)=>{let s=px;do{c.font=wt+" "+s+"px "+FF;if(c.measureText(txt).width<=w||s<=20)break;s-=2;}while(true);};
  const wrap=(txt,w,lh,y,px)=>{c.font="700 "+px+"px "+FF;const words=txt.split(" ");let line="";const lines=[];words.forEach(wd=>{const n=line?line+" "+wd:wd;if(c.measureText(n).width>w&&line){lines.push(line);line=wd;}else line=n;});lines.push(line);lines.forEach((l,i)=>c.fillText(l,X0,y+i*lh));return y+lines.length*lh;};
  c.fillStyle="#fff";c.fillRect(0,0,W,1500);
  c.fillStyle=K.navy;c.fillRect(0,0,W,130);
  c.fillStyle="#fff";c.textAlign=al;c.textBaseline="middle";c.font="700 30px "+FF;c.fillText(t("card_tag").toUpperCase()+"  ·  "+C[h.c].name,X0,65,W-2*P);
  c.textBaseline="alphabetic";let y=200;
  c.fillStyle=K.ink;fit(h.addr,W-2*P,64,900);c.fillText(iso(h.addr),X0,y+30);
  y+=84;c.fillStyle=K.mut;c.font="700 34px "+FF;c.fillText(h.city+", TX",X0,y,W-2*P);
  y+=40;
  const big=S.cash?fmt(h.price):fmt(pay(h))+t("per_mo");

/* ---------- share link + visitor counts ---------- */
const ANALYTICS={code:"",prefix:"trevor"};   /* GoatCounter site code (free, no cookies). Leave empty to turn counting off. */
function track(path,title){try{if(window.goatcounter&&window.goatcounter.count)window.goatcounter.count({path:ANALYTICS.prefix+"/"+path,title:title||path,event:true});}catch(e){}}
let _lastTrack="";
function trackResults(list){
  const sig=[...S.sel].map(i=>C[i].name).join(",")+"|"+(S.cash?"cash":S.loan)+"|"+S.beds+"|"+S.when;
  if(sig===_lastTrack)return; _lastTrack=sig;
  const areas=AREAS.filter(a=>areaState(a)===2).map(a=>a.id);
  track("results/"+(S.sel.size?(areas.length?areas.join("+"):"communities"):"anywhere"));
  track("buyer/"+(S.cash?"cash":S.loan));
}
document.addEventListener("click",e=>{const a=e.target.closest&&e.target.closest(".tour");if(a)track("tour-now");});
if(ANALYTICS.code){const sc=document.createElement("script");sc.async=true;sc.dataset.goatcounter="https://"+ANALYTICS.code+".goatcounter.com/count";sc.src="https://gc.zgo.at/count.js";document.head.appendChild(sc);}
function shareState(){
  const o={a:[...S.sel].map(i=>C[i].name+"|"+C[i].city),c:S.cash?1:0,m:S.mode,b:S.budget||0,l:S.loan,bd:S.beds,sf:S.sqft,fl:S.fl,w:S.when,d:S.dropsOnly?1:0,vx:S.vax?1:0,q:S.q,s:S.sort,v:S.view,g:LANG};

  const url=location.origin+location.pathname+"#r="+encodeURIComponent(JSON.stringify(shareState()));
  const fb=()=>{const ta=document.createElement("textarea");ta.value=url;document.body.appendChild(ta);ta.select();try{document.execCommand("copy");toast(t("shared"));}catch(e){}ta.remove();};
  try{navigator.clipboard.writeText(url).then(()=>toast(t("shared")),fb);}catch(e){fb();}

function applyShared(){
  try{
    const m=location.hash.match(/^#r=(.+)$/); if(!m)return false;
    const o=JSON.parse(decodeURIComponent(m[1]));
    const keys=new Map(C.map(c=>[c.name+"|"+c.city,c.i]));
